name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout karein
        uses: actions/checkout@v4

      - name: Node.js setup karein
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dependencies install karein
        run: npm ci
        working-directory: ./backend

      - name: Tests chalayein
        run: npm test
        working-directory: ./backend
