name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout karein
        uses: actions/checkout@v4

      - name: Node.js setup karein
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dependencies install karein
        run: npm ci

      - name: Tests chalayein
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Code checkout karein
        uses: actions/checkout@v4

      - name: Docker Hub mein login karein
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image build aur push karein
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mobile-asset-manager-backend:latest
